name: Lab alerts cron

# Runs every 5 minutes (the minimum GitHub Actions cron supports).
# At lab volume this is well within the free-tier minutes for a
# public repo. Also exposes a manual "Run workflow" button.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Avoid stacking runs if a previous one is still running
concurrency:
  group: lab-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund --silent

      - name: Send alerts
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-alerts.mjs
