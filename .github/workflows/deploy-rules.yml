name: Deploy Firestore rules

# Triggers
# --------
# Fires only when the rules file (or this workflow itself) changes on
# main, plus a manual button. We don't deploy on every unrelated commit
# — saves Action minutes and avoids spurious rule republishes.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

# Don't stack deploys if two pushes land back-to-back.
concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install -g firebase-tools --silent --no-audit --no-fund

      - name: Write service account to a temp file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Use the SAME secret that powers the cron. firebase deploy reads
        # GOOGLE_APPLICATION_CREDENTIALS for Application Default Credentials,
        # so once the JSON is on disk and the env var points at it, the
        # CLI authenticates non-interactively.
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project flylab-c1f97 --non-interactive
